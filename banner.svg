<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="55%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="glowCrimson1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#640816" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#640816" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3c0050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3c0050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCrimson2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5a0512" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5a0512" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="35"/></filter>
    <filter id="glowText"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <circle cx="140" cy="30" r="260" fill="url(#glowCrimson1)" filter="url(#blur1)"/>
  <circle cx="1050" cy="70" r="220" fill="url(#glowPurple)" filter="url(#blur1)"/>
  <circle cx="330" cy="230" r="200" fill="url(#glowCrimson2)" filter="url(#blur2)"/>

  <!-- sigil circle motif -->
  <g transform="translate(1080,110)" opacity="0.55">
    <circle r="70" fill="none" stroke="#a01428" stroke-width="1" opacity="0.5"/>
    <circle r="44" fill="none" stroke="#a01428" stroke-width="0.7" opacity="0.4"/>
    <circle r="20" fill="none" stroke="#a01428" stroke-width="0.6" opacity="0.4"/>
    <g stroke="#a01428" stroke-width="0.8" opacity="0.35">
      <line x1="-70" y1="0" x2="70" y2="0"/>
      <line x1="0" y1="-70" x2="0" y2="70"/>
      <line x1="-50" y1="-50" x2="50" y2="50"/>
      <line x1="-50" y1="50" x2="50" y2="-50"/>
    </g>
  </g>

  <g transform="translate(90,110)" opacity="0.4">
    <circle r="46" fill="none" stroke="#a01428" stroke-width="0.7"/>
    <circle r="26" fill="none" stroke="#a01428" stroke-width="0.5"/>
  </g>

  <rect width="1200" height="220" fill="url(#vignette)"/>

  <!-- floating sigils -->
  <text x="70" y="55" font-size="20" fill="#a01428" opacity="0.5">✦</text>
  <text x="1130" y="190" font-size="18" fill="#a01428" opacity="0.45">⚔</text>
  <text x="1000" y="45" font-size="16" fill="#a01428" opacity="0.4">⛦</text>
  <text x="150" y="185" font-size="18" fill="#a01428" opacity="0.4">♰</text>

  <text x="600" y="105" font-family="'UnifrakturMaguntia','Cinzel',Georgia,serif" font-size="62" fill="#f5f5f5" text-anchor="middle" letter-spacing="2" filter="url(#glowText)">ChyoeL</text>
  <text x="600" y="145" font-family="'Fraunces',Georgia,serif" font-size="17" fill="#b5b5b5" text-anchor="middle" letter-spacing="2">Fabric Modder &#8226; Kotlin &amp; Android Dev &#8226; Web Dev</text>
</svg>
